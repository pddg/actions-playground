name: Run MySQL

on:
  pull_request:

jobs:
  run:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        ports:
          - 3306:3306
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: testdb

    steps:
      - name: Wait for MySQL
        run: |
          until mysql --host=mysql --user=root --password=root -e "SELECT 1"; do
            echo "Waiting for MySQL..."
            sleep 2
          done
          echo "MySQL is ready!"
